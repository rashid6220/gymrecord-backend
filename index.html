<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GymRecord - Member Management</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        input[type="date"]::-webkit-calendar-picker-indicator {
            filter: invert(1);
            cursor: pointer;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen flex flex-col antialiased">

    <!-- ================= HEADER ================= -->
    <header class="bg-slate-900/90 backdrop-blur-md border-b border-slate-800 sticky top-0 z-50 py-3.5 shadow-md">
        <div class="max-w-7xl mx-auto px-4 flex flex-col md:flex-row justify-between items-center gap-4">

            <!-- Logo -->
            <div class="flex items-center space-x-3">
                <div class="bg-indigo-600 p-2.5 rounded-xl text-white shadow-lg shadow-indigo-600/30">
                    <i class="fa-solid fa-dumbbell text-2xl"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold text-white tracking-wide">GymRecord</h1>
                    <p class="text-xs text-slate-400">Management System</p>
                </div>
            </div>

            <!-- Search Bar -->
            <div class="w-full md:w-1/2">
                <div class="relative">
                    <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-3 text-slate-400 text-sm"></i>
                    <input
                        type="text"
                        id="search-input"
                        autocomplete="off"
                        placeholder="Search by name or phone number..."
                        class="w-full bg-slate-950 border border-slate-800 rounded-xl pl-10 pr-4 py-2 text-sm text-slate-100 focus:outline-none focus:border-indigo-500 transition shadow-inner">
                </div>
            </div>

        </div>
    </header>

    <!-- ================= MAIN ================= -->
    <main class="max-w-7xl mx-auto px-4 py-8 flex-1 w-full space-y-6">

        <!-- ================= STATS CARDS ================= -->
        <section class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <!-- Total Members Card -->
            <div class="bg-slate-900/80 border border-slate-800 p-5 rounded-2xl shadow-md hover:border-slate-700 transition flex items-center justify-between">
                <div>
                    <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Total Members</p>
                    <p id="stat-members-count" class="text-3xl font-extrabold text-white mt-1">0</p>
                </div>
                <div class="bg-indigo-500/10 p-3.5 rounded-2xl text-indigo-400 border border-indigo-500/20">
                    <i class="fa-solid fa-users text-2xl"></i>
                </div>
            </div>

            <!-- Total Revenue Card -->
            <div class="bg-slate-900/80 border border-slate-800 p-5 rounded-2xl shadow-md hover:border-slate-700 transition flex items-center justify-between">
                <div>
                    <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Total Paid Fees</p>
                    <p id="stat-revenue-count" class="text-3xl font-extrabold text-emerald-400 mt-1">₹0</p>
                </div>
                <div class="bg-emerald-500/10 p-3.5 rounded-2xl text-emerald-400 border border-emerald-500/20">
                    <i class="fa-solid fa-indian-rupee-sign text-2xl"></i>
                </div>
            </div>
        </section>

        <!-- ================= WORKSPACE ================= -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">

            <!-- ================= LEFT: FORM ================= -->
            <section class="lg:col-span-1">
                <div class="bg-slate-900/90 border border-slate-800 rounded-2xl p-6 shadow-xl sticky top-24">
                    <h2 class="text-lg font-bold text-white mb-5 flex items-center">
                        <i class="fa-solid fa-user-plus text-indigo-400 mr-2"></i> Add New Member
                    </h2>

                    <form id="add-member-form" class="space-y-4">
                        <!-- Name -->
                        <div>
                            <label class="block text-xs font-medium text-slate-300 mb-1">Full Name</label>
                            <input type="text" id="member-name" required maxlength="100" placeholder="Enter Name" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2 text-sm text-slate-100 focus:outline-none focus:border-indigo-500 transition">
                        </div>

                        <!-- Phone -->
                        <div>
                            <label class="block text-xs font-medium text-slate-300 mb-1">Phone Number</label>
                            <input type="tel" id="member-phone" required maxlength="10" inputmode="numeric" placeholder="Enter Phone Number" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2 text-sm text-slate-100 focus:outline-none focus:border-indigo-500 transition">
                        </div>

                        <!-- Address -->
                        <div>
                            <label class="block text-xs font-medium text-slate-300 mb-1">Address</label>
                            <input type="text" id="member-address" maxlength="250" placeholder="Enter Address" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2 text-sm text-slate-100 focus:outline-none focus:border-indigo-500 transition">
                        </div>

                        <!-- Paid / Due -->
                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <label class="block text-xs font-medium text-slate-300 mb-1">Paid Amount (₹)</label>
                                <input type="number" id="member-paid" required min="0" step="0.01" placeholder="0" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2 text-sm text-slate-100 focus:outline-none focus:border-indigo-500 transition">
                            </div>
                            <div>
                                <label class="block text-xs font-medium text-slate-300 mb-1">Due Amount (₹)</label>
                                <input type="number" id="member-due" value="0" min="0" step="0.01" placeholder="0" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2 text-sm text-slate-100 focus:outline-none focus:border-indigo-500 transition">
                            </div>
                        </div>

                        <!-- Dates -->
                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <label class="block text-xs font-medium text-slate-300 mb-1">Start Date</label>
                                <input type="date" id="member-join-date" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2 text-sm text-slate-100 focus:outline-none focus:border-indigo-500 transition">
                            </div>
                            <div>
                                <label class="block text-xs font-medium text-slate-300 mb-1">End Date</label>
                                <input type="date" id="member-close-date" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2 text-sm text-slate-100 focus:outline-none focus:border-indigo-500 transition">
                            </div>
                        </div>

                        <!-- Photo -->
                        <div>
                            <label class="block text-xs font-medium text-slate-300 mb-1">Member Photo</label>
                            <input type="file" id="member-photo" accept="image/jpeg,image/png,image/webp" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-2 py-1.5 text-xs text-slate-300 file:mr-3 file:py-1 file:px-2.5 file:rounded-lg file:border-0 file:text-xs file:bg-indigo-600 file:text-white hover:file:bg-indigo-500 cursor-pointer transition">
                            <p class="text-[10px] text-slate-500 mt-1">Max photo size: 2 MB</p>
                        </div>

                        <!-- Submit Button -->
                        <button type="submit" id="save-member-btn" class="w-full bg-indigo-600 hover:bg-indigo-500 disabled:opacity-50 disabled:cursor-not-allowed text-white font-medium py-2.5 rounded-xl text-sm transition shadow-lg shadow-indigo-600/20 active:scale-[0.99]">
                            <i class="fa-solid fa-save mr-1.5"></i> Save Member
                        </button>
                    </form>
                </div>
            </section>

            <!-- ================= RIGHT: TABLE ================= -->
            <section class="lg:col-span-2">
                <div class="bg-slate-900/90 border border-slate-800 rounded-2xl p-6 shadow-xl">
                    <div class="flex justify-between items-center mb-5">
                        <h2 class="text-lg font-bold text-white flex items-center">
                            <i class="fa-solid fa-address-book text-indigo-400 mr-2"></i> Member Directory
                        </h2>
                        <button type="button" id="refresh-btn" class="text-xs bg-slate-800 hover:bg-slate-700 px-3 py-1.5 rounded-lg text-slate-300 transition">
                            <i class="fa-solid fa-rotate-right mr-1"></i> Refresh
                        </button>
                    </div>

                    <div class="overflow-x-auto">
                        <table class="w-full text-left text-sm text-slate-300">
                            <thead class="bg-slate-950/80 text-xs uppercase tracking-wider text-slate-400 border-b border-slate-800">
                                <tr>
                                    <th class="py-3 px-3">Photo</th>
                                    <th class="py-3 px-3">Name / Phone</th>
                                    <th class="py-3 px-3">Address</th>
                                    <th class="py-3 px-3">Fee Details</th>
                                    <th class="py-3 px-3">End Date</th>
                                </tr>
                            </thead>
                            <tbody id="members-table-body" class="divide-y divide-slate-800/60">
                                <tr>
                                    <td colspan="5" class="py-6 text-center text-slate-500 text-xs">Loading data...</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </section>

        </div>
    </main>

    <!-- ================= FOOTER ================= -->
    <footer class="bg-slate-900 border-t border-slate-800 py-4 text-center text-xs text-slate-500">
        <p>GymRecord - Member Management System v0.2</p>
    </footer>

    <script>
        let allMembers = [];

        function escapeHTML(value) {
            if (value === null || value === undefined) return '';
            return String(value)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        function getValue(member, key, index, fallback = '') {
            if (member && typeof member === 'object' && !Array.isArray(member) && member[key] !== undefined && member[key] !== null) {
                return member[key];
            }
            if (Array.isArray(member) && member[index] !== undefined && member[index] !== null) {
                return member[index];
            }
            return fallback;
        }

        function getTodayString() {
            const date = new Date();
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        function getNextMonthString() {
            const date = new Date();
            date.setMonth(date.getMonth() + 1);
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        function setDefaultDates() {
            document.getElementById('member-join-date').value = getTodayString();
            document.getElementById('member-close-date').value = getNextMonthString();
        }

        function convertImageToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result);
                reader.onerror = () => reject(new Error('Failed to read photo file.'));
                reader.readAsDataURL(file);
            });
        }

        function updateDashboard() {
            if (!Array.isArray(allMembers)) return;
            const totalMembers = allMembers.length;
            let totalRevenue = 0;

            allMembers.forEach(member => {
                const fee = Number.parseFloat(getValue(member, 'fee', 3, 0));
                if (Number.isFinite(fee)) {
                    totalRevenue += fee;
                }
            });

            document.getElementById('stat-members-count').innerText = totalMembers;
            document.getElementById('stat-revenue-count').innerText = `₹${totalRevenue.toLocaleString('en-IN', {
                minimumFractionDigits: 0,
                maximumFractionDigits: 2
            })}`;
        }

        async function loadMembers() {
            const tbody = document.getElementById('members-table-body');
            tbody.innerHTML = `
                <tr>
                    <td colspan="5" class="py-6 text-center text-slate-500 text-xs">
                        <i class="fa-solid fa-spinner fa-spin mr-1.5"></i> Loading members...
                    </td>
                </tr>
            `;

            try {
                const response = await fetch('/api/members', {
                    method: 'GET',
                    headers: { 'Accept': 'application/json' }
                });

                if (!response.ok) {
                    throw new Error(`Server Error: ${response.status}`);
                }

                const data = await response.json();
                if (!Array.isArray(data)) {
                    throw new Error('API returned invalid data format.');
                }

                allMembers = data;
                updateDashboard();
                filterMembers();
            } catch (error) {
                console.error('Load Members Error:', error);
                allMembers = [];
                document.getElementById('stat-members-count').innerText = '0';
                document.getElementById('stat-revenue-count').innerText = '₹0';
                tbody.innerHTML = `
                    <tr>
                        <td colspan="5" class="py-6 text-center text-rose-400 text-xs">
                            <i class="fa-solid fa-triangle-exclamation mr-1.5"></i> Could not load data. Please check Python server.
                        </td>
                    </tr>
                `;
            }
        }

        function renderTable(data) {
            const tbody = document.getElementById('members-table-body');
            if (!Array.isArray(data) || data.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="5" class="py-6 text-center text-slate-500 text-xs">
                            No member records found
                        </td>
                    </tr>
                `;
                return;
            }

            tbody.innerHTML = data.map(member => {
                const name = getValue(member, 'name', 1, 'Unknown');
                const phone = getValue(member, 'phone', 2, '-');
                const address = getValue(member, 'address', 7, 'N/A');
                const fee = Number.parseFloat(getValue(member, 'fee', 3, 0)) || 0;
                const due = Number.parseFloat(getValue(member, 'due', 8, 0)) || 0;
                const closeDate = getValue(member, 'close_date', 6, '-');
                const photo = getValue(member, 'photo', 9, '');

                let photoHTML = `
                    <div class="w-10 h-10 rounded-full bg-slate-800 flex items-center justify-center border border-slate-700">
                        <i class="fa-solid fa-user text-slate-400 text-sm"></i>
                    </div>
                `;

                if (typeof photo === 'string' && (photo.startsWith('data:image/') || photo.startsWith('https://') || photo.startsWith('http://'))) {
                    photoHTML = `
                        <img src="${escapeHTML(photo)}" class="w-10 h-10 rounded-full object-cover border-2 border-indigo-500/80 shadow" alt="Photo" loading="lazy">
                    `;
                }

                return `
                    <tr class="hover:bg-slate-800/40 transition text-xs border-b border-slate-800/50">
                        <td class="py-3.5 px-3">${photoHTML}</td>
                        <td class="py-3.5 px-3">
                            <p class="font-bold text-white text-sm">${escapeHTML(name)}</p>
                            <p class="text-slate-400 mt-0.5"><i class="fa-solid fa-phone text-[10px] mr-1"></i>${escapeHTML(phone)}</p>
                        </td>
                        <td class="py-3.5 px-3 text-slate-300"><i class="fa-solid fa-location-dot text-slate-500 mr-1"></i>${escapeHTML(address)}</td>
                        <td class="py-3.5 px-3">
                            <p class="text-emerald-400 font-semibold">Paid: ₹${fee.toLocaleString('en-IN')}</p>
                            ${due > 0 ? `<p class="text-rose-400 font-semibold mt-0.5">Due: ₹${due.toLocaleString('en-IN')}</p>` : `<p class="text-slate-500 text-[10px] mt-0.5">No Due</p>`}
                        </td>
                        <td class="py-3.5 px-3">
                            <span class="bg-slate-950 border border-slate-800 px-2.5 py-1 rounded-md text-rose-300 font-medium inline-block">
                                ${escapeHTML(closeDate)}
                            </span>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        function filterMembers() {
            if (!Array.isArray(allMembers)) return;
            const query = document.getElementById('search-input').value.toLowerCase().trim();
            const filtered = allMembers.filter(member => {
                const name = String(getValue(member, 'name', 1, '')).toLowerCase();
                const phone = String(getValue(member, 'phone', 2, '')).toLowerCase();
                return name.includes(query) || phone.includes(query);
            });
            renderTable(filtered);
        }

        async function addMember(event) {
            event.preventDefault();

            const name = document.getElementById('member-name').value.trim();
            const phone = document.getElementById('member-phone').value.trim();
            const address = document.getElementById('member-address').value.trim();
            const paid = Number.parseFloat(document.getElementById('member-paid').value);
            const dueInput = document.getElementById('member-due').value;
            const due = dueInput === '' ? 0 : Number.parseFloat(dueInput);
            const joinDate = document.getElementById('member-join-date').value;
            const closeDate = document.getElementById('member-close-date').value;
            const photoInput = document.getElementById('member-photo');

            if (!name) { alert('Please enter member name.'); return; }
            if (!/^[6-9][0-9]{9}$/.test(phone)) { alert('Please enter a valid 10-digit phone number.'); return; }
            if (!Number.isFinite(paid) || paid < 0) { alert('Please enter a valid paid amount.'); return; }
            if (!Number.isFinite(due) || due < 0) { alert('Please enter a valid due amount.'); return; }
            if (!joinDate || !closeDate) { alert('Please select both Start Date and End Date.'); return; }
            if (closeDate < joinDate) { alert('End Date cannot be earlier than Start Date.'); return; }

            let photoBase64 = '';
            if (photoInput.files && photoInput.files.length > 0) {
                const file = photoInput.files[0];
                if (file.size > 2 * 1024 * 1024) { alert('Photo size must be less than 2 MB.'); return; }
                if (!['image/jpeg', 'image/png', 'image/webp'].includes(file.type)) { alert('Only JPG, PNG or WEBP photos are allowed.'); return; }

                try {
                    photoBase64 = await convertImageToBase64(file);
                } catch (error) {
                    alert('Error reading photo file.');
                    return;
                }
            }

            const button = document.getElementById('save-member-btn');
            const oldButtonHTML = button.innerHTML;
            button.disabled = true;
            button.innerHTML = `<i class="fa-solid fa-spinner fa-spin mr-1.5"></i> Saving...`;

            try {
                const response = await fetch('/api/add_member', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                    body: JSON.stringify({
                        name: name,
                        phone: phone,
                        address: address,
                        fee: paid,
                        due: due,
                        join_date: joinDate,
                        close_date: closeDate,
                        photo: photoBase64
                    })
                });

                let result = null;
                try { result = await response.json(); } catch (_) {}

                if (!response.ok) {
                    throw new Error(result?.message || result?.error || `Server Error: ${response.status}`);
                }

                document.getElementById('add-member-form').reset();
                document.getElementById('member-due').value = '0';
                setDefaultDates();
                await loadMembers();
                alert('Member record saved successfully.');
            } catch (error) {
                console.error('Add Member Error:', error);
                alert('Failed to save member:\n' + error.message);
            } finally {
                button.disabled = false;
                button.innerHTML = oldButtonHTML;
            }
        }

        document.getElementById('add-member-form').addEventListener('submit', addMember);
        document.getElementById('search-input').addEventListener('input', filterMembers);
        document.getElementById('refresh-btn').addEventListener('click', loadMembers);

        document.addEventListener('DOMContentLoaded', () => {
            setDefaultDates();
            loadMembers();
        });
    </script>
</body>
</html>
